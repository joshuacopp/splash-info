# Splash Dashboard Worker — SSO entry point.
#
# DEPLOY STRATEGY (Step 6 — B2 cutover-only):
# Production routes are intentionally NOT bound. Worker is deployed to its
# *.workers.dev fallback URL until apps/web ships in Step 7 and the routes
# can be flipped over with no dual-ownership window.
#
# When ready to cut over (Step 7), uncomment the `routes` block. Note the
# new URL layout: this worker only owns `/api/*` paths now — apps/web owns
# `/`, `/login`, `/admin/*`. The legacy `POST /login` URL is retired.

name = "splash-dashboard"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Defaults to true when no `routes` are set, but set explicitly so it's
# obvious the workers.dev URL is the primary deploy target right now.
workers_dev = true

# MFA enforcement (layer 3) kill-switch. Read by @splash/auth authenticate():
# when "true", a user with a VERIFIED factor whose session is still aal1 is
# treated as unauthenticated (bounced to re-auth through the MFA step). Unset
# elsewhere, so enforcement is live on THIS worker only — dashboard-worker is
# the first rollout target. Flip to "false" (or delete) + redeploy to disable
# instantly without a code revert. Non-enrolled users are unaffected regardless.
[vars]
MFA_ENFORCE = "true"

# Staging routes (Brief 16) — bind dashboard-worker's SSO endpoints to
# staging.splashcarwashes.info so apps/web (also bound to the staging
# subdomain) can call them same-origin. Includes /api/me (added in
# Brief 11a) so the Header can render the user identity row in staging.
#
# Brief 168 (2026-06-11): apex production twins staged inside this same
# `routes` array, COMMENTED so they're inert. Operator uncomments + pushes
# at the cutover window (see CUTOVER_RUNBOOK.md Phase A). Until then
# nothing routes to the apex; staging keeps working unchanged. /api/me
# is the previously-known gap from CUTOVER_READINESS §2.2 — staged with
# its siblings so the Header's identity row works post-flip.
routes = [
  { pattern = "staging.splashcarwashes.info/api/login",        zone_name = "splashcarwashes.info" },
  { pattern = "staging.splashcarwashes.info/api/login/mfa",    zone_name = "splashcarwashes.info" },
  { pattern = "staging.splashcarwashes.info/api/logout",       zone_name = "splashcarwashes.info" },
  { pattern = "staging.splashcarwashes.info/api/forced-reset", zone_name = "splashcarwashes.info" },
  { pattern = "staging.splashcarwashes.info/api/me",           zone_name = "splashcarwashes.info" },
  { pattern = "staging.splashcarwashes.info/api/mfa/*",        zone_name = "splashcarwashes.info" },
  { pattern = "staging.splashcarwashes.info/api/refresh",      zone_name = "splashcarwashes.info" },
  # === CUTOVER §5 forward path (2026-06-11): admin-API carves LIVE on apex ===
  # Exact-host → these survive apps/web's future /* catch-all (path is more
  # specific than /*). Matches the live CF state (already bound during Phase A;
  # repo now reconciled so a future deploy can't yank them). apps/web /* is
  # still bound LAST, as its own deliberate step.
  { pattern = "splashcarwashes.info/api/login",        zone_name = "splashcarwashes.info" },
  { pattern = "splashcarwashes.info/api/login/mfa",    zone_name = "splashcarwashes.info" },  # MFA step-up (path more specific than apps/web /*)
  { pattern = "splashcarwashes.info/api/logout",       zone_name = "splashcarwashes.info" },
  { pattern = "splashcarwashes.info/api/forced-reset", zone_name = "splashcarwashes.info" },
  { pattern = "splashcarwashes.info/api/me",           zone_name = "splashcarwashes.info" },  # (gap fix — Header /api/me, READINESS §2.2)
  { pattern = "splashcarwashes.info/api/mfa/*",        zone_name = "splashcarwashes.info" },  # MFA enroll/verify (additive; path more specific than apps/web /*)
  { pattern = "splashcarwashes.info/api/refresh",      zone_name = "splashcarwashes.info" }   # sliding-session keepalive
]

# Bindings (set with `wrangler secret put`):
# SUPABASE_URL          — string
# SUPABASE_ANON_KEY     — secret (used for /auth/v1/token + /auth/v1/user)
# SUPABASE_SERVICE_KEY  — secret (used for user_permissions reads via @splash/db-supabase)
# TURNSTILE_SECRET_KEY  — secret. Login anti-abuse. UNBOUND = Turnstile skipped
#                         (dev). MUST be bound in production. Pairs with the
#                         public NEXT_PUBLIC_TURNSTILE_SITE_KEY built into apps/web.

# Login rate limiter (src/rate-limit.ts). Coarse fixed-window counters keyed
# per-IP and per-email. UNBOUND = fail-open (dev). Create the namespace with
#   wrangler kv namespace create LOGIN_RATE_LIMIT
# then paste the returned id below before the production deploy.
[[kv_namespaces]]
binding = "LOGIN_RATE_LIMIT"
id = "f9513ef94c844797984ec5606d882388"

# Brief 63 (2026-05-07): keeps Workers Logs sticky across deploys. Without
# this, CF Builds re-provisions the worker on every push and the dashboard
# "Logs → Enabled" toggle reverts to off. New workers should copy this block.
[observability.logs]
enabled = true
invocation_logs = true

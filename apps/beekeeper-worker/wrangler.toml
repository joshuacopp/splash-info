# Splash Beekeeper Shift Worker.
#
# Lets the schedule UI add / edit / delete Beekeeper shifts directly via the
# Shifts API, replacing the old xlsx download -> fill -> reupload workflow.
# The Beekeeper bot token stays server-side; the frontend never sees it.
#
# ROUTE LAYOUT
#   API-ONLY surface, path-carved onto the apex host at
#   splashcarwashes.info/schedule/api/* — same pattern as workorders-worker's
#   /workorders/api/*. The UI (location picker + week-grid calendar) now lives
#   in apps/web at app/schedule/* and inherits the shared design system + navy
#   header. apps/web SSR reaches this worker via the BEEKEEPER_WORKER service
#   binding; interactive writes post same-origin from the browser.
#
#   The API-only carve is deliberate for routing: apps/web owns the catch-all
#   splashcarwashes.info/* and serves the /schedule and /schedule/{code} pages;
#   this worker's more-specific /schedule/api/* out-ranks that catch-all so the
#   JSON API keeps resolving. The SSO sb-access-token cookie is host-only, so
#   sharing the apex hostname is what lets both the pages and the API see the
#   session. index.ts still strips the /schedule prefix before segment routing.
#
#     GET  splashcarwashes.info/schedule/api/locations       accessible locations
#     GET  splashcarwashes.info/schedule/api/loc/{code}/context
#     GET  splashcarwashes.info/schedule/api/loc/{code}/shifts?start=&end=
#     POST splashcarwashes.info/schedule/api/loc/{code}/shifts
#     PUT  splashcarwashes.info/schedule/api/loc/{code}/shifts/{shiftId}
#     DEL  splashcarwashes.info/schedule/api/loc/{code}/shifts/{shiftId}
#     POST splashcarwashes.info/schedule/api/sync-users      manual cache refill

name = "beekeeper-worker"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

# API-only carve on the apex host so the worker shares the dashboard's host-only
# SSO cookie (see ROUTE LAYOUT above). ONLY /schedule/api/* is bound now — the
# bare /schedule and /schedule/{code} page routes are owned by apps/web's
# catch-all, which renders the ported React UI. This more-specific /schedule/api/*
# out-ranks apps/web's splashcarwashes.info/* on path specificity, so the JSON
# API keeps resolving here while the pages fall through to apps/web.
# Before first deploy, delete the old `schedule.splashcarwashes.info` Custom
# Domain in the Cloudflare dashboard — the apex route below replaces it entirely.
routes = [
  { pattern = "splashcarwashes.info/schedule/api/*",         zone_name = "splashcarwashes.info" },
  { pattern = "staging.splashcarwashes.info/schedule/api/*", zone_name = "splashcarwashes.info" }
]

# Bindings:
# SUPABASE_URL          — string. `wrangler secret put SUPABASE_URL` (same
#                         Supabase project URL bound on every other worker).
# SUPABASE_ANON_KEY     — secret. Required by authenticate() in @splash/auth
#                         (the /auth/v1/user round-trip uses the anon key).
# SUPABASE_SERVICE_KEY  — secret. Service-role client for the beekeeper_users /
#                         beekeeper_schedules cache reads+writes and the
#                         sysadmin_audit_log shift-mutation audit. Same value as
#                         on splash-sysadmin / splash-damage.
# BEEKEEPER_TOKEN       — secret. Beekeeper bot-account API token (Admin or
#                         location-admin scope). `wrangler secret put
#                         BEEKEEPER_TOKEN`. Sent as `Authorization: Token <v>`.

# Non-secret env vars.
#   BEEKEEPER_BASE_URL — upstream API root. Defaults in code to the production
#                        tenant (splashcarwashes.us.beekeeper.io/api/2). Only
#                        set here to point at a sandbox tenant.
#   SYNC_ADMIN_EMAILS  — comma-separated operator emails allowed to fire the
#                        manual POST /api/sync-users in addition to super_admins.
[vars]
# BEEKEEPER_BASE_URL = "https://splashcarwashes.us.beekeeper.io/api/2"
SYNC_ADMIN_EMAILS = "josh.copp@splashcarwashes.com"

# Daily Beekeeper user + schedule cache sync. 10:00 UTC = 6:00 AM ET. Runs
# before the workorders MaintainX sync (11:30 UTC) — no dependency, just a
# tidy "overnight caches refill before the workday" ordering. The scheduled
# handler in src/index.ts paginates /users + /shifts/schedules and upserts the
# beekeeper_users / beekeeper_schedules tables. Fail-soft: logs + exits on
# error, never throws out of the scheduled handler.
[triggers]
crons = ["0 10 * * *"]

# Keeps Workers Logs sticky across deploys (Brief 63 convention). Scheduled
# invocations show up here too with eventType: scheduled.
[observability.logs]
enabled = true
invocation_logs = true

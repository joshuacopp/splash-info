# Splash Work Orders Worker — Brief 70 + Brief 71.
#
# Read-only MaintainX integration. Surfaces open / in-progress / on-hold
# work orders to operators on apps/web's /workorders page (server
# component SSR-fetches GET /workorders/api/list via the
# WORKORDERS_WORKER service binding).
#
# Permission domain (Brief 71): pure email-on-locations match against
# `locations.am_email` / `rm_email` / `site_email`. super_admin and
# admin do NOT have a global override. The damage-worker's MaintainX
# write path (Brief 42 / 43 — `createMaintainXWorkOrder`) is unchanged;
# this worker is a sibling, not a replacement.
#
# SECOND SURFACE — /workorders/api/parts/* (Parts Directory).
# `src/parts.ts` adds a small CRUD API over the `parts_directory`
# Supabase table, backing apps/web's parts directory page:
#
#   GET    /workorders/api/parts?search=&equipment=   any session
#   POST   /workorders/api/parts                      super_admin
#   PATCH  /workorders/api/parts/{id}                 super_admin
#   DELETE /workorders/api/parts/{id}                 super_admin
#
# It is hosted here because this worker already carries the three
# Supabase bindings and is already service-bound from apps/web — no new
# worker, no new secrets, no new routes. NOTE the deliberately different
# permission domain: the directory is one shared company-wide list, so
# reads are NOT email-on-locations scoped; every authenticated session
# sees every row. Writes gate on `session.role === "super_admin"` (the
# platform role, not `dcRole`). Part photos live in the apps/web-bound
# `splash-parts-manuals` R2 bucket; this worker stores only the key.
#
# ROUTES: nothing was added for the parts surface, on purpose. apps/web
# SSR reads through the WORKORDERS_WORKER service binding (which does
# not need a route), and browser writes are proxied through apps/web
# route handlers on its own origin. The staging route below already
# covers /workorders/api/* if a same-origin call is ever wanted there.
#
# DEPLOY STRATEGY: workers.dev fallback only until apps/web cuts over.
# Staging route binds /workorders/api/* on staging.splashcarwashes.info
# so apps/web (also bound to staging) can call same-origin (per Brief
# 16 pattern). Production routes intentionally NOT bound (commented).

name = "splash-workorders"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

# Staging routes (Brief 16 pattern).
#
# Brief 169 (2026-06-11): apex production twin staged inside this same
# `routes` array, COMMENTED so it's inert. Operator uncomments + pushes
# at the cutover window (see CUTOVER_RUNBOOK.md Phase B). Until then
# nothing routes to the apex; staging keeps working unchanged.
routes = [
  { pattern = "staging.splashcarwashes.info/workorders/api/*", zone_name = "splashcarwashes.info" },

  # MaintainX webhook receiver — apex, bound EARLY and deliberately narrow.
  #
  # This is a single exact path, NOT the /workorders/api/* wildcard on the line
  # below it. Uncommenting Phase B would route this worker's whole API surface
  # on production, which is the thing the UI cutover gates; the webhook needs
  # one path and should not drag the rest forward with it. Cloudflare resolves
  # most-specific-first, so this out-ranks apps/web's apex `/*` catch-all
  # without touching anything else.
  #
  # Safe to expose ahead of the cutover: the route carries no session, reads no
  # cookie, and is gated entirely by the HMAC in src/mx-webhook-verify.ts.
  #
  # The subscription URL registered with MaintainX is baked into the
  # subscription and cannot be edited without PATCH /subscriptions/{id} — which
  # is why this is the apex and not staging or workers.dev. A production
  # integration pointed at a host named "staging" invites someone to tear it
  # down.
  { pattern = "splashcarwashes.info/workorders/api/mx-webhook", zone_name = "splashcarwashes.info" },

  # === CUTOVER PHASE B — uncomment the line(s) below + push at the flip window ===
  # { pattern = "splashcarwashes.info/workorders/api/*", zone_name = "splashcarwashes.info" }
]

# Bindings:
# SUPABASE_URL          — string. Set via `wrangler secret put SUPABASE_URL`
#                         (matches the deploy-time pattern used on every
#                         other worker; the value is the same Supabase
#                         project URL bound on splash-damage / splash-sysadmin).
# SUPABASE_ANON_KEY     — secret. `wrangler secret put SUPABASE_ANON_KEY`.
#                         Required by `authenticate()` in @splash/auth — the
#                         /auth/v1/user round-trip uses the anon key.
# SUPABASE_SERVICE_KEY  — secret. `wrangler secret put SUPABASE_SERVICE_KEY`
#                         (same value as on splash-damage / splash-sysadmin —
#                         service-role bypasses RLS for the bulk
#                         maintainx_id resolution chain, and for every
#                         parts_directory read/write: that table has RLS on
#                         with no policies, so service-role is the ONLY way in).
# MAINTAINX_API_KEY     — secret. `wrangler secret put MAINTAINX_API_KEY`
#                         with the SAME value already bound on splash-damage
#                         (Brief 42). The API key is per-organization, not
#                         per-worker; this worker reuses it for the GET
#                         /workorders read path. Optional — when unbound
#                         the endpoint returns 503 and the page surfaces a
#                         friendly "integration not configured" empty state.
#                         The parts surface does NOT need it.
# MAINTAINX_WEBHOOK_SECRET — secret. `wrangler secret put MAINTAINX_WEBHOOK_SECRET`.
#                         A COMMA-SEPARATED LIST, not one value. Measured
#                         2026-09-14: MaintainX issues one signing secret per
#                         SUBSCRIPTION, not per endpoint URL — seven
#                         subscriptions on this one URL returned seven
#                         different secrets. One subscription is one event (the
#                         create body is a oneOf over single-value enums), so
#                         covering seven events means holding seven keys;
#                         verification tries each.
#
#                         Adding an eighth event later means appending its
#                         secret and re-binding, or that event silently 401s.
#
#                         scripts/create-mx-subscriptions.mjs prints the list
#                         ready to paste. Each value is also re-readable from
#                         GET /subscriptions/{id}/secret.
#                         NOT the same value as MAINTAINX_API_KEY.
#
#                         Unbound, every delivery is refused with 401 rather
#                         than falling open — which from the outside is
#                         indistinguishable from an attack, so a `no_secret`
#                         line in Workers Logs is the signal that the worker
#                         deployed without it.

# Brief 70 — non-secret env vars consumed by the MaintainX read path.
#   MAINTAINX_BASE_URL — REST root (no trailing /workorders). Mirrors the
#                        damage-worker var of the same name (Brief 42).
#   APPS_WEB_BASE_URL  — populated for parity with damage-worker so future
#                        cross-link rendering inside responses can reuse it.
#                        Not consumed in this brief's v1 endpoint shape.
#
#   WORKORDERS_READ_SOURCE — where GET /workorders/api/list reads from.
#                        "maintainx" (default, and what any unrecognised value
#                        resolves to) keeps the live API calls. "postgres"
#                        serves the local mirror the ingest and the webhook
#                        receiver fill.
#
#                        LEFT UNSET ON PURPOSE. Do not set it to "postgres"
#                        without first confirming the mirror agrees with
#                        MaintainX: on 2026-09-14 it was short ~51 active work
#                        orders, a hole the watermark-advance bug (fixed in
#                        27d8083) had left behind and which the incremental
#                        sweep can never find, because those rows' updatedAt is
#                        permanently behind the watermark.
#
#                        To check before flipping, as a super_admin:
#                          /workorders/api/list?source=postgres
#                          /workorders/api/list?source=maintainx
#                        and diff. The per-request override is super_admin-only
#                        and the response carries a `source` field saying which
#                        one answered.
#
#                        To compare in bulk, against the whole account:
#                          select count(*) from mx_work_order
#                           where status in ('OPEN','IN_PROGRESS','ON_HOLD')
#                             and deleted_at is null
#                             and mx_updated_at < now() - interval '3 hours';
#                        Exclude a trailing window like that when comparing:
#                        MaintainX's LIST endpoint lags its own writes by an
#                        hour or two, while our webhook path re-fetches by id
#                        immediately, so for very recent work orders the mirror
#                        is legitimately AHEAD of what the list returns and a
#                        raw count looks like a mismatch in both directions.
# R2 mirror for MaintainX attachments (2026-09-14).
#
# Its OWN bucket, not a share of splash-parts-manuals. Every feature in this
# repo owns one, and CLAUDE.md records what cross-worker bucket sharing cost
# last time: forms-worker needed PROMO_FILES bound, step (b) of a three-step
# change was missed, and promo materials silently vanished from emails with no
# error anywhere. Only this worker binds this bucket; apps/web serves the bytes
# by proxying through the WORKORDERS_WORKER service binding (Brief 88 pattern),
# so there is no second binding to forget.
#
# Why a copy exists at all: MaintainX hands back presigned S3 URLs with
# X-Amz-Expires=3600. They cannot be stored and re-used later, and there is no
# key to re-sign with. The bytes have to be taken while the link is live.
[[r2_buckets]]
binding     = "WORKORDER_FILES"
bucket_name = "splash-workorder-files"

[vars]
MAINTAINX_BASE_URL = "https://api.getmaintainx.com/v1"
APPS_WEB_BASE_URL  = "https://splashcarwashes.info"
# CUTOVER 2026-09-14: /workorders now reads the local mirror, not live
# MaintainX calls. Roll back by commenting this line and pushing -- the
# MaintainX path is untouched and an unset value resolves back to it.
WORKORDERS_READ_SOURCE = "postgres"

# Brief 71 — daily MaintainX user/team sync. 11:30 UTC = 6:30 AM ET. Runs
# BEFORE the damage-worker daily summary cron at 13:00 UTC so any new
# MaintainX users created overnight propagate to Supabase before they
# could appear as assignees in that day's damage-summary email.
#
# Brief 74 — MaintainX -> Postgres ingest, every 5 minutes. One bounded pass
# per invocation (src/mx-ingest.ts); the 6-month backfill completes across many
# ticks and then settles into a cheap incremental sweep. The scheduled handler
# in src/index.ts branches on `controller.cron` and compares against these
# strings EXACTLY — changing a schedule here without changing USER_SYNC_CRON /
# MX_INGEST_CRON there stops that pass silently.
[triggers]
crons = ["30 11 * * *", "*/5 * * * *"]

# Brief 63 (2026-05-07): keeps Workers Logs sticky across deploys. Without
# this, CF Builds re-provisions the worker on every push and the dashboard
# "Logs → Enabled" toggle reverts to off. New workers must include this
# block from day one.
[observability.logs]
enabled = true
invocation_logs = true

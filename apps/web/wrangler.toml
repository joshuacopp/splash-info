# apps/web — Next.js app deployed to Cloudflare Workers via @opennextjs/cloudflare.
#
# Per migration plan Q1: NO route binding yet. Until Step 7 (page ports) is
# done and we cut traffic over, the legacy workers continue to own /admin/*,
# /signup/* (UI), /sysadmin/* (UI), etc. This worker is buildable + deployable
# to its *.workers.dev URL only.

name = "splash-web"
main = ".open-next/worker.js"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

# Staging routes (Brief 16) — apps/web is bound to a catch-all on
# staging.splashcarwashes.info. CF's most-specific-match-wins routing
# means the per-worker patterns (dashboard /api/*, signup /admin/api/*
# /signup/* /q/* /join/*, performance /pertrack/*, sysadmin
# /sysadmin/api/*, damage /manage/api/* /claims-api/* /claims/*) outrank
# this catch-all automatically — apps/web only handles paths NOT bound
# to a worker. The [assets] binding below keeps working unchanged on
# the new domain (per-deploy, not per-route). NEXT_PUBLIC_*_WORKER_URL
# env vars stay unset for staging deploys: server-side helpers fall
# back to the request host (staging.splashcarwashes.info), and all
# routes resolve through CF same-origin.
#
# Brief 168 (2026-06-11): apex production twin staged inside this same
# `routes` array, COMMENTED so it's inert. Operator uncomments + pushes
# at the cutover window (see CUTOVER_RUNBOOK.md Phase A). Until then
# nothing routes to the apex; staging keeps working unchanged.
#
# NOTE: this `routes` key is at the top level — it MUST appear before
# any `[table]` header (e.g. `[assets]`) or TOML will scope it into
# that table.
routes = [
  { pattern = "staging.splashcarwashes.info/*", zone_name = "splashcarwashes.info" },
  # === CUTOVER PHASE A — uncomment the line(s) below + push at the flip window ===
  # { pattern = "splashcarwashes.info/*", zone_name = "splashcarwashes.info" }
]

# Service bindings (Brief 17) — apps/web SSR helpers call sibling workers
# via direct in-runtime bindings instead of URL fetches. This avoids
# Cloudflare's same-zone Worker-to-Worker subrequest gotcha (URL fetches
# from one Worker to another on the same zone loop through the edge and
# 522 after ~19s). With service bindings, env.<BINDING>.fetch(req) is
# routed internally and Cookie/headers pass through cleanly. Service
# names match the `name = "..."` in each sibling worker's wrangler.toml.
# `[[services]]` are top-level array-of-tables and MUST appear before any
# `[table]` header (e.g. `[assets]`).
[[services]]
binding = "DASHBOARD_WORKER"
service = "splash-dashboard"

[[services]]
binding = "SIGNUP_WORKER"
service = "splash-signup-next"

[[services]]
binding = "PERFORMANCE_WORKER"
service = "splash-performance"

[[services]]
binding = "SYSADMIN_WORKER"
service = "splash-sysadmin"

[[services]]
binding = "DAMAGE_WORKER"
service = "splash-damage"

# Brief 70 — workorders-worker (read-only MaintainX integration).
[[services]]
binding = "WORKORDERS_WORKER"
service = "splash-workorders"

# Brief 83 — fleet-inquiry-worker admin endpoints (submissions viewer + CSV).
# Worker name on Cloudflare: `splash-fleet-inquiry`. Public form routes on
# this worker stay anonymous; the /admin/api/* surface is cookie-gated.
[[services]]
binding = "FLEET_INQUIRY_WORKER"
service = "splash-fleet-inquiry"

# Brief 89 — forms-worker (form-builder feature). Worker name on
# Cloudflare: `splash-forms`. Path-carved on apps/web's hostname per
# planning Decision 2 (cookie + CSV simplicity). apps/web's admin
# pages (/admin/forms/*) call this worker via the binding for SSR;
# the public form pages (/forms/{slug}) are served directly by the
# worker via the path-carved staging/production route — no apps/web
# involvement on the public surface.
[[services]]
binding = "FORMS_WORKER"
service = "splash-forms"

# Brief 107 — jotform-worker (JotForm submission ingest + admin viewer
# API). Worker name on Cloudflare: `splash-jotform`. Path-carved on
# `/jotform/*` (webhook) and `/admin/jotform/api/*` (admin reads).
# apps/web's admin pages (Brief 108 will wire `/admin/jotform/*`) call
# this worker via the binding for SSR. Workers.dev only at brief land;
# production routes operator-driven post-cutover.
[[services]]
binding = "JOTFORM_WORKER"
service = "splash-jotform"

# Brief 153 — promo-worker (promotions feature foundation). Worker name
# on Cloudflare: `splash-promo`. Path-carved on `/promo/*`. Internal
# tooling only; no public-customer surface. Workers.dev only at Brief
# 153; production routes operator-driven post-cutover. apps/web admin
# pages (`/admin/promotions/*`) will land in Brief 154+ and call this
# worker via the binding for SSR.
[[services]]
binding = "PROMO_WORKER"
service = "splash-promo"

# OpenNext static asset binding (CSS/JS/public/).
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Bindings (Supabase env). Apps/web reads pricing/locations server-side.
# SUPABASE_URL          — string
# SUPABASE_ANON_KEY     — secret
# SUPABASE_SERVICE_KEY  — secret

# Brief 63 (2026-05-07): keeps Workers Logs sticky across deploys. Without
# this, CF Builds re-provisions the worker on every push and the dashboard
# "Logs → Enabled" toggle reverts to off. New workers should copy this block.
[observability.logs]
enabled = true
invocation_logs = true

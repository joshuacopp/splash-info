

name = "splash-sysadmin"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

# Staging routes (Brief 16) — bind sysadmin-worker to
# staging.splashcarwashes.info so apps/web (also bound to staging) can
# call /sysadmin/api/* same-origin.
#
# Brief 168 (2026-06-11): apex production twin staged inside this same
# `routes` array, COMMENTED so it's inert. Operator uncomments + pushes
# at the cutover window (see CUTOVER_RUNBOOK.md Phase A). Until then
# nothing routes to the apex; staging keeps working unchanged.
routes = [
  { pattern = "staging.splashcarwashes.info/sysadmin/api/*", zone_name = "splashcarwashes.info" },
  # === CUTOVER §5 forward path (2026-06-11): admin-API carve LIVE on apex ===
  # Exact-host → survives apps/web's future /* catch-all. Matches live CF state
  # (already bound during Phase A; repo now reconciled). apps/web /* bound LAST.
  { pattern = "splashcarwashes.info/sysadmin/api/*", zone_name = "splashcarwashes.info" }
]

# Bindings:
# SUPABASE_URL          — string
# SUPABASE_ANON_KEY     — secret
# SUPABASE_SERVICE_KEY  — secret (admin API + writes to user_permissions /
#                         user_tool_access / sysadmin_audit_log all use service key)

# Brief 63 (2026-05-07): keeps Workers Logs sticky across deploys. Without
# this, CF Builds re-provisions the worker on every push and the dashboard
# "Logs → Enabled" toggle reverts to off. New workers should copy this block.
[observability.logs]
enabled = true
invocation_logs = true

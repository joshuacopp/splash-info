

name = "splash-sysadmin"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

# Step 7 cutover routes (uncomment when apps/web is ready):
# routes = [
#   { pattern = "splashcarwashes.info/sysadmin/api/*", zone_name = "splashcarwashes.info" }
# ]

# Staging routes (Brief 16) — bind sysadmin-worker to
# staging.splashcarwashes.info so apps/web (also bound to staging) can
# call /sysadmin/api/* same-origin. Production routes above stay
# commented; staging is purely additive.
routes = [
  { pattern = "staging.splashcarwashes.info/sysadmin/api/*", zone_name = "splashcarwashes.info" }
]

# Bindings:
# SUPABASE_URL          — string
# SUPABASE_ANON_KEY     — secret
# SUPABASE_SERVICE_KEY  — secret (admin API + writes to user_permissions /
#                         user_tool_access / sysadmin_audit_log all use service key)

# Brief 63 (2026-05-07): keeps Workers Logs sticky across deploys. Without
# this, CF Builds re-provisions the worker on every push and the dashboard
# "Logs → Enabled" toggle reverts to off. New workers should copy this block.
[observability.logs]
enabled = true
invocation_logs = true

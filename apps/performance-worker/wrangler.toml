# Splash Performance Tracker Worker.
#
# DEPLOY STRATEGY (Step 6 — B2 cutover-only):
# Production routes intentionally NOT bound. Worker is deployed to its
# *.workers.dev fallback URL until apps/web ships in Step 7. No
# dual-ownership window with the legacy worker — performance-worker
# is one of the four non-production workers per Josh's production-state
# inventory (only signup-worker has real customer traffic today).
#
# When ready to cut over (Step 7), uncomment the `routes` block.

name = "splash-performance"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

# Staging routes (Brief 16) — bind performance-worker to
# staging.splashcarwashes.info so apps/web (also bound to staging) can
# call /pertrack/* same-origin.
#
# Brief 168 (2026-06-11): apex production twin staged inside this same
# `routes` array, COMMENTED so it's inert. Operator uncomments + pushes
# at the cutover window (see CUTOVER_RUNBOOK.md Phase A). Until then
# nothing routes to the apex; staging keeps working unchanged.
routes = [
  { pattern = "staging.splashcarwashes.info/pertrack/*", zone_name = "splashcarwashes.info" },
  # === CUTOVER PHASE A — ACTIVATED 2026-06-11 ===
  { pattern = "splashcarwashes.info/pertrack/*", zone_name = "splashcarwashes.info" }
]

# Bindings:
# SUPABASE_URL          — string
# SUPABASE_ANON_KEY     — secret
# SUPABASE_SERVICE_KEY  — secret
#
# RENAME during this port: legacy/performancetracker.js refers to
# SUPABASE_SERVICE_ROLE_KEY. The migration plan standardizes on
# SUPABASE_SERVICE_KEY across all 5 workers — this worker now matches.
# Update the env var name in the Cloudflare dashboard before deploying
# to workers.dev (the binding the worker reads is SUPABASE_SERVICE_KEY).

# Brief 63 (2026-05-07): keeps Workers Logs sticky across deploys. Without
# this, CF Builds re-provisions the worker on every push and the dashboard
# "Logs → Enabled" toggle reverts to off. New workers should copy this block.
[observability.logs]
enabled = true
invocation_logs = true

# Splash Performance Tracker Worker.
#
# DEPLOY STRATEGY (Step 6 — B2 cutover-only):
# Production routes intentionally NOT bound. Worker is deployed to its
# *.workers.dev fallback URL until apps/web ships in Step 7. No
# dual-ownership window with the legacy worker — performance-worker
# is one of the four non-production workers per Josh's production-state
# inventory (only signup-worker has real customer traffic today).
#
# When ready to cut over (Step 7), uncomment the `routes` block.

name = "splash-performance"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

# Staging routes (Brief 16) — bind performance-worker to
# staging.splashcarwashes.info so apps/web (also bound to staging) can
# call /pertrack/* same-origin.
#
# Brief 168 (2026-06-11): apex production twin staged inside this same
# `routes` array, COMMENTED so it's inert. Operator uncomments + pushes
# at the cutover window (see CUTOVER_RUNBOOK.md Phase A). Until then
# nothing routes to the apex; staging keeps working unchanged.
routes = [
  { pattern = "staging.splashcarwashes.info/pertrack/*", zone_name = "splashcarwashes.info" },
  # === CUTOVER PHASE A — uncomment the line(s) below + push at the flip window ===
  # (ROLLED BACK 2026-06-11 — re-flip with apps/web catch-all bound LAST.)
  # { pattern = "splashcarwashes.info/pertrack/*", zone_name = "splashcarwashes.info" }
]

# Weekly greeter digest. WEDNESDAYS 09:00 UTC = 4am EST / 5am EDT.
#
# WEDNESDAY, NOT MONDAY, AND THE REASON IS DATA NOT TASTE. `digestWeekFor`
# reports the last COMPLETE Mon-Sun week, so the send day decides two things at
# once: how stale the report is, and how much of it exists yet. Measured over
# the settled weeks of Aug-Sep 2026, the share of a week's greeter_daily rows
# actually entered by each candidate send time:
#
#     send day      data present     report age
#     Monday        ~70%             1 day
#     Wednesday     ~95%             3 days
#     Sunday        ~98%             7 days
#
# Monday is the tempting one and it is a trap: it reports a week that is barely
# two-thirds typed in, AND compares it against a prior week that is fully in,
# so every site reads as declining when nothing has changed. Wednesday buys
# near-complete data for two days of freshness.
#
# WHAT THIS REPLACED. Production fired on SUNDAY 09:00 UTC for the first three
# sends (confirmed from outbound_emails: 2026-09-13, -20, -27, all Sun), while
# this file said Monday and always had. One day of schedule error cost SEVEN
# days of report lag, because a Sunday run falls inside the not-yet-complete
# week and `digestWeekFor` correctly steps back a whole week. If the digest
# ever looks a week stale again, check the firing DAY in outbound_emails before
# anything else.
#
# Cron triggers fire independently of the `routes` table above — a worker with
# no production route still runs its cron. Deploying this file schedules the
# send; there is no second switch. NOTE the Sunday divergence above means a
# dashboard-set trigger can outlive what is written here — check Settings →
# Trigger Events after deploying, not just this line.
#
# UTC IS THE ONLY OPTION Cloudflare offers, so the send time moves an hour at
# each DST boundary rather than the weekday moving. Do not "fix" the drift by
# adding a second cron: two triggers would enqueue twice, and while the
# outbound_emails dedup index would absorb it, the second run is still a full
# estate read for nothing.
[triggers]
crons = ["0 9 * * 3"]

# Bindings:
# SUPABASE_URL          — string
# SUPABASE_ANON_KEY     — secret
# SUPABASE_SERVICE_KEY  — secret
#
# RENAME during this port: legacy/performancetracker.js refers to
# SUPABASE_SERVICE_ROLE_KEY. The migration plan standardizes on
# SUPABASE_SERVICE_KEY across all 5 workers — this worker now matches.
# Update the env var name in the Cloudflare dashboard before deploying
# to workers.dev (the binding the worker reads is SUPABASE_SERVICE_KEY).

# Brief 63 (2026-05-07): keeps Workers Logs sticky across deploys. Without
# this, CF Builds re-provisions the worker on every push and the dashboard
# "Logs → Enabled" toggle reverts to off. New workers should copy this block.
[observability.logs]
enabled = true
invocation_logs = true

[vars]
# MFA enforcement (layer 3). Read by @splash/auth authenticate(): a user who has
# a VERIFIED factor but whose session is still aal1 is treated as
# unauthenticated. Non-enrolled users are unaffected regardless.
#
# Rolled out here 2026-09-25. Before that this worker ACCEPTED un-elevated
# sessions: completing the password step and abandoning the code step granted
# full access to everything this worker serves, because enforcement lived only
# on dashboard-worker -- the one worker that merely DESCRIBES the session rather
# than holding data.
#
# Flip to "false" (or delete) + redeploy to disable instantly without a code
# revert.
MFA_ENFORCE = "true"

# Splash Signup Worker — port-in-progress.
#
# DEPLOY STRATEGY (Chunk 1 — B2 cutover-only):
# This is a fresh worker that deploys to its own *.workers.dev URL. The
# legacy production worker (deployed from the original Claude Project) keeps
# its production routes — we are NOT taking traffic until the dedicated
# cutover plan is greenlit.
#
# Worker name: "splash-signup-next" — distinct from the legacy production
# worker name to avoid clobbering. Workers' production routes (preserved
# below in COMMENTED form) are bound to the legacy worker; deploying this
# worker name does not move them.
#
# CUTOVER (separate conversation when its turn comes):
#   1. Final shape verified at workers.dev
#   2. Parallel deployment / shadow testing decisions made
#   3. Production routes flipped from legacy script → splash-signup-next
#   4. Worker renamed to "splash-signup" OR routes pointed at the -next name
#   5. Rollback path documented + practiced
#
# Until then: this worker only reaches the workers.dev fallback URL.

name = "splash-signup-next"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

# WARNING: /signup/{loc}, /q/{loc}, /join/{loc} URLs are load-bearing.
# Saved on customer/admin device home screens. Do not rename.
# (See BUILD_STATE.md → "Load-bearing constraints".)
#
# Staging routes (Brief 16) — bind signup-worker's admin pricing JSON API
# AND the customer-facing surface (/signup, /q, /join, /api/submit-signup)
# to staging.splashcarwashes.info so the full system can be exercised
# end-to-end on a single origin. Customer routes are NOT load-bearing on
# the staging subdomain (no customer bookmarks point there) — the
# load-bearing-URL warning above applies to the production routes only.
# Per decision 8, signup-worker owns customer-facing rendering.
#
# CUTOVER PHASE C apex twins (Brief 170) live inside this single active
# `routes` array, commented/inert, under a grep-able banner. Activation =
# operator parity-checks `splash-signup-next` vs production
# (`info-signup-worker`) on workers.dev/staging, runs the pre-cutover SQL
# guard, then uncomments the apex line(s) below + pushes at the cutover
# window. CF Builds binds the apex routes to `splash-signup-next` on push,
# removing them from `info-signup-worker` (CUTOVER_RUNBOOK.md Phase C).
# Worker name stays `splash-signup-next` — NO rename — so apps/web's
# `SIGNUP_WORKER` service binding keeps working without any apps/web
# change. NOTE: `/signup/*`, `/q/*`, `/join/*` are load-bearing customer
# bookmark URLs — keep each apex twin's path EXACTLY as the staging line
# has it (CLAUDE.md constraint #1). `/api/submit-signup` is an EXACT path,
# never a wildcard — a `/api/*` wildcard would swallow dashboard-worker's
# `/api/login|logout|forced-reset|me` (CUTOVER_READINESS §2.4).
# Rollback: in the CF dashboard, move the apex routes back to
# `info-signup-worker`; durable rollback = re-comment + push.
routes = [
  { pattern = "staging.splashcarwashes.info/admin/api/*",        zone_name = "splashcarwashes.info" },
  { pattern = "staging.splashcarwashes.info/api/submit-signup",  zone_name = "splashcarwashes.info" },
  { pattern = "staging.splashcarwashes.info/signup/*",           zone_name = "splashcarwashes.info" },
  { pattern = "staging.splashcarwashes.info/q/*",                zone_name = "splashcarwashes.info" },
  { pattern = "staging.splashcarwashes.info/join/*",             zone_name = "splashcarwashes.info" },
  # === CUTOVER PHASE C — LIVE (2026-06-13 signup migration) ===
  # Verified ready: parity (render byte-identical to legacy), secrets bound
  # (staging renders live Supabase pricing), penny guard is a no-op, and a
  # real test submit landed a correct maxpass_signups row (BOGO fields incl.).
  # These are EXACT-host paths → they out-rank apps/web's /* and serve from
  # splash-signup-next. On push, CF reassigns each route off the legacy
  # info-signup-worker onto this worker. /api/submit-signup is EXACT (never a
  # /api/* wildcard — that would swallow dashboard's /api/login|logout|me).
  # Rollback: in CF dashboard move these routes back to info-signup-worker;
  # durable rollback = re-comment + push.
  { pattern = "splashcarwashes.info/signup/*",          zone_name = "splashcarwashes.info" },
  { pattern = "splashcarwashes.info/q/*",               zone_name = "splashcarwashes.info" },
  { pattern = "splashcarwashes.info/join/*",            zone_name = "splashcarwashes.info" },
  { pattern = "splashcarwashes.info/api/submit-signup", zone_name = "splashcarwashes.info" },
  { pattern = "splashcarwashes.info/admin/api/*",       zone_name = "splashcarwashes.info" }
]

# Vars (plain — set via dashboard or [vars] block):
# SIGNATURE_MODE       — "inline" (default, production path) | "jotform" (dormant)
#                        Switch flips signature collection between inline-form +
#                        direct maxpass_signups insert and JotForm redirect with
#                        prefill. See apps/signup-worker/src/signature/.
[vars]
SIGNATURE_MODE = "inline"

# Bindings (set with `wrangler secret put` for the *_KEY values):
# SUPABASE_URL          — string (env var via dashboard or [vars])
# SUPABASE_ANON_KEY     — secret
# SUPABASE_SERVICE_KEY  — secret (suspicious_phones / phone_usage_log writes
#                         + maxpass_signups insert use service key per legacy)

# Brief 63 (2026-05-07): keeps Workers Logs sticky across deploys. Without
# this, CF Builds re-provisions the worker on every push and the dashboard
# "Logs → Enabled" toggle reverts to off. New workers should copy this block.
[observability.logs]
enabled = true
invocation_logs = true

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SCORM Package Builder</title>
<style>
  :root {
    --splash-navy: #1c164e;
    --splash-blue: #2b3491;
    --splash-blue-dark: #20276e;
    --sudsy-blue: #3dbeee;
    --sudsy-blue-soft: #d6f1fb;
    --yellow: #f1c61e;
    --racecar-red: #dc3e26;
    --ok: #067647;
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e3e6eb;
    --border-strong: #d0d4dc;
    --muted: #6b7280;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 16px;
    --shadow-card: 0 10px 30px rgba(28, 22, 78, 0.18);
    --shadow-btn: 0 4px 12px rgba(43, 52, 145, 0.25);
    --font-body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: var(--font-body); font-size: 14px;
    color: var(--splash-navy);
    background: linear-gradient(160deg, var(--splash-blue) 0%, var(--splash-navy) 100%);
    background-attachment: fixed;
    min-height: 100vh;
  }
  header.topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 32px;
    color: #fff;
    flex-wrap: wrap; gap: 16px;
  }
  header.topbar .brand {
    display: flex; align-items: center; gap: 18px;
    text-decoration: none; color: inherit;
  }
  header.topbar .brand img {
    height: 56px; width: auto; object-fit: contain; flex-shrink: 0;
  }
  header.topbar .brand-text { display: flex; flex-direction: column; gap: 2px; }
  header.topbar .brand-text .eyebrow {
    font-size: 0.75rem; font-weight: 600;
    letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--sudsy-blue);
  }
  header.topbar .brand-text .title {
    font-size: 1.375rem; font-weight: 700; color: #fff; line-height: 1.2;
  }
  main {
    max-width: 880px; margin: 12px auto 64px; padding: 0 24px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px 28px;
    box-shadow: var(--shadow-card);
    margin-bottom: 20px;
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px;
  }
  .panel-head h2 {
    margin: 0; font-size: 16px; font-weight: 700;
    letter-spacing: -0.005em;
  }
  .panel-head .hint { font-size: 12px; color: var(--muted); }
  label.field {
    display: block; margin-bottom: 14px;
  }
  label.field > .label {
    display: block;
    font-size: 12px; font-weight: 600;
    letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--sudsy-blue);
    margin-bottom: 6px;
  }
  label.field > .sub {
    display: block; font-size: 12px; color: var(--muted); margin-top: 4px;
  }
  input[type=text], input[type=number], textarea, select {
    width: 100%;
    padding: 10px 12px;
    font: 14px var(--font-body); color: var(--splash-navy);
    background: #fff;
    border: 1.5px solid var(--border);
    border-radius: var(--radius-sm);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input:focus, textarea:focus, select:focus {
    outline: none; border-color: var(--splash-blue);
    box-shadow: 0 0 0 3px rgba(61,190,238,0.25);
  }
  textarea { min-height: 80px; resize: vertical; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .video-drop {
    border: 2px dashed var(--border-strong);
    border-radius: var(--radius-md);
    padding: 28px;
    text-align: center;
    background: #fafbfd;
    transition: background .15s ease, border-color .15s ease;
    cursor: pointer;
  }
  .video-drop.hover { background: var(--sudsy-blue-soft); border-color: var(--sudsy-blue); }
  .video-drop input { display: none; }
  .video-drop .big { font-size: 15px; font-weight: 600; }
  .video-drop .small { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .video-info {
    margin-top: 10px; padding: 10px 14px;
    background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: var(--radius-sm);
    font-size: 13px; color: #166534;
    display: none;
  }
  .video-info.show { display: block; }
  .video-info strong { font-weight: 700; }
  .video-info button.clear {
    float: right; background: transparent; border: none; color: var(--racecar-red);
    cursor: pointer; font-weight: 600; font-size: 12px;
  }
  .questions {
    display: flex; flex-direction: column; gap: 14px;
  }
  .question {
    border: 1.5px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px;
    background: #fafbfd;
    position: relative;
  }
  .question .qhead {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .question .qhead .qnum {
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--sudsy-blue);
  }
  .question .qhead button.remove {
    background: transparent; border: none; color: var(--racecar-red);
    cursor: pointer; font-weight: 600; font-size: 12px;
  }
  .question .choices { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .question .choice {
    display: flex; align-items: center; gap: 10px;
  }
  .question .choice input[type=radio] {
    appearance: none; width: 18px; height: 18px;
    border: 1.5px solid var(--border-strong); border-radius: 50%;
    background: #fff; cursor: pointer; flex-shrink: 0;
    position: relative;
  }
  .question .choice input[type=radio]:checked {
    border-color: var(--splash-blue); background: var(--splash-blue);
  }
  .question .choice input[type=radio]:checked::after {
    content: ''; position: absolute; inset: 4px;
    background: #fff; border-radius: 50%;
  }
  .question .choice input[type=text] { flex: 1; }
  .question .tf {
    display: flex; gap: 10px; margin-top: 8px;
  }
  .question .tf label {
    flex: 1; display: flex; align-items: center; gap: 8px;
    padding: 10px 14px; background: #fff;
    border: 1.5px solid var(--border); border-radius: var(--radius-sm);
    cursor: pointer; font-weight: 600;
  }
  .question .tf input[type=radio]:checked + span { color: var(--splash-blue); }
  .question .tf label:has(input:checked) {
    border-color: var(--splash-blue); background: var(--sudsy-blue-soft);
  }
  .btn {
    appearance: none; border: 1.5px solid transparent; cursor: pointer;
    padding: 10px 16px;
    border-radius: var(--radius-sm);
    font: 700 13px var(--font-body);
    letter-spacing: 0.02em;
    transition: filter .15s ease, transform .05s ease, box-shadow .15s ease;
  }
  .btn:hover { filter: brightness(1.1); box-shadow: 0 4px 10px rgba(28,22,78,0.18); }
  .btn:active { transform: translateY(1px); }
  .btn.primary { background: var(--splash-blue); color: #fff; }
  .btn.secondary { background: #fff; color: var(--splash-blue); border-color: var(--splash-blue); }
  .btn.secondary:hover { background: var(--sudsy-blue-soft); }
  .btn.large { padding: 14px 28px; font-size: 15px; }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; filter: none; box-shadow: none; }
  .build-bar {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: var(--radius-lg); padding: 18px 24px;
    box-shadow: var(--shadow-card);
    position: sticky; bottom: 18px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px;
  }
  .build-bar .status { font-size: 13px; color: var(--muted); flex: 1; }
  .build-bar .status.ok { color: var(--ok); font-weight: 600; }
  .build-bar .status.err { color: var(--racecar-red); font-weight: 600; }
  .build-bar progress {
    width: 100%; height: 6px; margin-top: 6px;
    appearance: none;
  }
  .build-bar progress::-webkit-progress-bar { background: var(--border); border-radius: 3px; }
  .build-bar progress::-webkit-progress-value { background: var(--splash-blue); border-radius: 3px; }
  .build-bar progress::-moz-progress-bar { background: var(--splash-blue); border-radius: 3px; }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img src="https://pub-88f136a47a5846d5b7e47fbce605719b.r2.dev/SplashScriptWhite_RedCar.png" alt="Splash Car Washes">
    <div class="brand-text">
      <div class="eyebrow">Internal Tool</div>
      <div class="title">SCORM Package Builder</div>
    </div>
  </div>
</header>

<main>

<div class="panel">
  <div class="panel-head">
    <h2>Course basics</h2>
  </div>
  <label class="field">
    <span class="label">Course title</span>
    <input type="text" id="title" placeholder="e.g. Damage Claim Submission Training">
  </label>
  <label class="field">
    <span class="label">Short description (optional)</span>
    <textarea id="description" placeholder="What this course covers in 1–2 sentences."></textarea>
  </label>
  <div class="row">
    <label class="field">
      <span class="label">Pass threshold (%)</span>
      <input type="number" id="passScore" value="80" min="1" max="100">
      <span class="sub">Score the learner must hit to be marked passed.</span>
    </label>
    <label class="field">
      <span class="label">Course identifier (auto)</span>
      <input type="text" id="courseId" placeholder="auto-generated" readonly>
      <span class="sub">Used inside the SCORM manifest. Don't edit.</span>
    </label>
  </div>
</div>

<div class="panel">
  <div class="panel-head">
    <h2>Video</h2>
  </div>
  <div class="video-drop" id="videoDrop" tabindex="0" role="button">
    <div class="big">Drop a video file here, or click to choose</div>
    <div class="small">.mp4 recommended · .webm and .mov also work</div>
  </div>
  <input type="file" id="videoInput" accept="video/*" style="display:none">
  <div class="video-info" id="videoInfo">
    <button class="clear" type="button" id="videoClear">Remove</button>
    <strong id="videoName"></strong> · <span id="videoSize"></span>
  </div>
</div>

<div class="panel">
  <div class="panel-head">
    <h2>Quiz questions</h2>
    <button class="btn secondary" type="button" id="addQuestion">+ Add question</button>
  </div>
  <div class="questions" id="questions"></div>
</div>

<div class="build-bar">
  <div>
    <div class="status" id="status">Fill in the fields, then build the SCORM package.</div>
    <progress id="progress" max="100" value="0" style="display:none"></progress>
  </div>
  <button class="btn primary large" type="button" id="buildBtn">Build SCORM package</button>
</div>

</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
"use strict";

// ---------- state ----------
const state = {
  title: "",
  description: "",
  passScore: 80,
  courseId: "COURSE-" + crypto.randomUUID().slice(0, 8).toUpperCase(),
  video: null, // File
  questions: [] // {id, type: 'mc'|'tf', text, choices[], correctIndex}
};

document.getElementById("courseId").value = state.courseId;

// ---------- bindings ----------
const titleEl = document.getElementById("title");
const descEl  = document.getElementById("description");
const passEl  = document.getElementById("passScore");
const videoDrop = document.getElementById("videoDrop");
const videoInput = document.getElementById("videoInput");
const videoInfo = document.getElementById("videoInfo");
const videoName = document.getElementById("videoName");
const videoSize = document.getElementById("videoSize");
const videoClear = document.getElementById("videoClear");
const questionsEl = document.getElementById("questions");
const addQ = document.getElementById("addQuestion");
const buildBtn = document.getElementById("buildBtn");
const statusEl = document.getElementById("status");
const progressEl = document.getElementById("progress");

titleEl.addEventListener("input", e => state.title = e.target.value);
descEl.addEventListener("input", e => state.description = e.target.value);
passEl.addEventListener("input", e => state.passScore = Math.max(1, Math.min(100, Number(e.target.value) || 80)));

// ---------- video pick / drop ----------
// Note: the drop zone is a <div>, NOT a <label> with nested <input>.
// A nested-input label fires the file picker TWICE on click in Chrome
// (once via the label's implicit input routing, once via our JS), and
// the second invocation can return a 0-byte File proxy that overwrites
// the real selection. We open the picker explicitly from one place.
videoDrop.addEventListener("click", () => videoInput.click());
videoDrop.addEventListener("keydown", e => {
  if (e.key === "Enter" || e.key === " ") {
    e.preventDefault();
    videoInput.click();
  }
});
videoDrop.addEventListener("dragover", e => { e.preventDefault(); videoDrop.classList.add("hover"); });
videoDrop.addEventListener("dragleave", () => videoDrop.classList.remove("hover"));
videoDrop.addEventListener("drop", e => {
  e.preventDefault();
  videoDrop.classList.remove("hover");
  if (e.dataTransfer.files && e.dataTransfer.files[0]) {
    setVideo(e.dataTransfer.files[0]);
  }
});
videoInput.addEventListener("change", e => {
  if (e.target.files && e.target.files[0]) setVideo(e.target.files[0]);
});
videoClear.addEventListener("click", () => {
  state.video = null;
  videoInput.value = "";
  videoInfo.classList.remove("show");
});

function setVideo(file) {
  // Defensive: if the browser handed us an empty file proxy, refuse it
  // and surface a clear error rather than silently storing 0 bytes.
  if (!file || typeof file.size !== "number" || file.size === 0) {
    console.warn("[scorm-builder] setVideo got an empty file:", file);
    statusEl.textContent = "Couldn't read that video (0 bytes). Try the file picker again, or drag-drop instead.";
    statusEl.className = "status err";
    return;
  }
  state.video = file;
  videoName.textContent = file.name;
  videoSize.textContent = formatBytes(file.size);
  videoInfo.classList.add("show");
  statusEl.textContent = "Video loaded: " + file.name + " (" + formatBytes(file.size) + ").";
  statusEl.className = "status ok";
}

function formatBytes(n) {
  if (n < 1024) return n + " B";
  if (n < 1024*1024) return (n/1024).toFixed(1) + " KB";
  if (n < 1024*1024*1024) return (n/1024/1024).toFixed(1) + " MB";
  return (n/1024/1024/1024).toFixed(2) + " GB";
}

// ---------- questions ----------
addQ.addEventListener("click", () => addQuestion("mc"));

function addQuestion(type) {
  const q = {
    id: crypto.randomUUID().slice(0, 8),
    type,
    text: "",
    choices: type === "mc" ? ["", "", "", ""] : ["True", "False"],
    correctIndex: 0
  };
  state.questions.push(q);
  renderQuestions();
}

function removeQuestion(id) {
  state.questions = state.questions.filter(q => q.id !== id);
  renderQuestions();
}

function renderQuestions() {
  questionsEl.innerHTML = "";
  if (state.questions.length === 0) {
    questionsEl.innerHTML = '<div style="color:var(--muted);font-size:13px;">No questions yet. Click "Add question" to start.</div>';
    return;
  }
  state.questions.forEach((q, idx) => {
    const div = document.createElement("div");
    div.className = "question";
    div.innerHTML = `
      <div class="qhead">
        <span class="qnum">Question ${idx + 1} · ${q.type === "mc" ? "Multiple choice" : "True / False"}</span>
        <button class="remove" type="button">Remove</button>
      </div>
      <label class="field">
        <span class="label">Question text</span>
        <textarea class="q-text" placeholder="Write the question here">${escapeHtml(q.text)}</textarea>
      </label>
      <label class="field">
        <span class="label">Type</span>
        <select class="q-type">
          <option value="mc" ${q.type === "mc" ? "selected" : ""}>Multiple choice</option>
          <option value="tf" ${q.type === "tf" ? "selected" : ""}>True / False</option>
        </select>
      </label>
      ${q.type === "mc" ? renderMCChoices(q) : renderTFChoices(q)}
    `;
    div.querySelector(".remove").addEventListener("click", () => removeQuestion(q.id));
    div.querySelector(".q-text").addEventListener("input", e => { q.text = e.target.value; });
    div.querySelector(".q-type").addEventListener("change", e => {
      q.type = e.target.value;
      q.choices = q.type === "mc" ? ["", "", "", ""] : ["True", "False"];
      q.correctIndex = 0;
      renderQuestions();
    });
    if (q.type === "mc") {
      div.querySelectorAll(".mc-choice").forEach((row, i) => {
        row.querySelector("input[type=radio]").addEventListener("change", () => { q.correctIndex = i; });
        row.querySelector("input[type=text]").addEventListener("input", e => { q.choices[i] = e.target.value; });
      });
    } else {
      div.querySelectorAll(".tf input[type=radio]").forEach((r, i) => {
        r.addEventListener("change", () => { q.correctIndex = i; });
      });
    }
    questionsEl.appendChild(div);
  });
}

function renderMCChoices(q) {
  const rows = q.choices.map((c, i) => `
    <div class="choice mc-choice">
      <input type="radio" name="correct-${q.id}" ${q.correctIndex === i ? "checked" : ""}>
      <input type="text" placeholder="Choice ${i + 1}" value="${escapeAttr(c)}">
    </div>
  `).join("");
  return `
    <div class="field">
      <span class="label">Choices (select the correct answer)</span>
      <div class="choices">${rows}</div>
    </div>
  `;
}

function renderTFChoices(q) {
  return `
    <div class="field">
      <span class="label">Correct answer</span>
      <div class="tf">
        <label>
          <input type="radio" name="tf-${q.id}" ${q.correctIndex === 0 ? "checked" : ""}>
          <span>True</span>
        </label>
        <label>
          <input type="radio" name="tf-${q.id}" ${q.correctIndex === 1 ? "checked" : ""}>
          <span>False</span>
        </label>
      </div>
    </div>
  `;
}

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}
function escapeAttr(s) { return escapeHtml(s); }
function escapeXml(s) {
  return String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[m]));
}
function escapeJs(s) {
  return JSON.stringify(String(s ?? ""));
}

// ---------- validation ----------
function validate() {
  const errs = [];
  if (!state.title.trim()) errs.push("Title is required.");
  if (!state.video) errs.push("Video file is required.");
  if (state.questions.length === 0) errs.push("Add at least one question.");
  state.questions.forEach((q, i) => {
    if (!q.text.trim()) errs.push(`Question ${i + 1} text is empty.`);
    if (q.type === "mc") {
      const filled = q.choices.filter(c => c.trim()).length;
      if (filled < 2) errs.push(`Question ${i + 1} needs at least 2 choices.`);
      if (!q.choices[q.correctIndex] || !q.choices[q.correctIndex].trim())
        errs.push(`Question ${i + 1}: the marked-correct choice is empty.`);
    }
  });
  return errs;
}

// ---------- SCORM package build ----------
buildBtn.addEventListener("click", async () => {
  const errs = validate();
  if (errs.length) {
    statusEl.textContent = errs.join(" ");
    statusEl.className = "status err";
    return;
  }
  buildBtn.disabled = true;
  statusEl.className = "status";
  progressEl.style.display = "block";

  try {
    setProgress(5, "Reading video…");
    const videoBytes = await state.video.arrayBuffer();
    const videoExt = (state.video.name.split(".").pop() || "mp4").toLowerCase();
    const videoMime = state.video.type || guessMime(videoExt);

    setProgress(20, "Building manifest…");
    const manifest = buildManifest(state, "video." + videoExt);

    setProgress(35, "Building player…");
    const indexHtml = buildIndexHtml(state, "video." + videoExt, videoMime);
    const scormJs   = buildScormJs();
    const styleCss  = buildStyleCss();

    setProgress(55, "Zipping…");
    const zip = new JSZip();
    zip.file("imsmanifest.xml", manifest);
    zip.file("index.html", indexHtml);
    zip.file("scorm.js", scormJs);
    zip.file("style.css", styleCss);
    zip.file("video." + videoExt, videoBytes);

    const blob = await zip.generateAsync({
      type: "blob",
      compression: "DEFLATE",
      compressionOptions: { level: 6 }
    }, meta => {
      // 55-95% during zip
      setProgress(55 + Math.round(meta.percent * 0.4), "Zipping… " + Math.round(meta.percent) + "%");
    });

    setProgress(100, "Done — downloading.");
    const safeTitle = state.title.trim().replace(/[^a-z0-9-_ ]/gi, "").replace(/\s+/g, "_").slice(0, 60) || "scorm-package";
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = safeTitle + ".zip";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);

    statusEl.textContent = "SCORM package ready. Upload the .zip to your LMS.";
    statusEl.className = "status ok";
  } catch (err) {
    console.error(err);
    statusEl.textContent = "Build failed: " + (err && err.message ? err.message : String(err));
    statusEl.className = "status err";
  } finally {
    buildBtn.disabled = false;
    setTimeout(() => { progressEl.style.display = "none"; }, 2000);
  }
});

function setProgress(pct, msg) {
  progressEl.value = pct;
  statusEl.textContent = msg;
  statusEl.className = "status";
}

function guessMime(ext) {
  return ({
    mp4: "video/mp4",
    m4v: "video/mp4",
    mov: "video/quicktime",
    webm: "video/webm",
    ogv: "video/ogg",
    ogg: "video/ogg"
  })[ext] || "video/mp4";
}

// ---------- file templates ----------
function buildManifest(s, videoFilename) {
  return `<?xml version="1.0" encoding="UTF-8"?>
<manifest identifier="${escapeXml(s.courseId)}" version="1.2"
  xmlns="http://www.imsproject.org/xsd/imscp_rootv1p1p2"
  xmlns:adlcp="http://www.adlnet.org/xsd/adlcp_rootv1p2"
  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
  xsi:schemaLocation="http://www.imsproject.org/xsd/imscp_rootv1p1p2 imscp_rootv1p1p2.xsd
                      http://www.imsglobal.org/xsd/imsmd_rootv1p2p1 imsmd_rootv1p2p1.xsd
                      http://www.adlnet.org/xsd/adlcp_rootv1p2 adlcp_rootv1p2.xsd">
  <metadata>
    <schema>ADL SCORM</schema>
    <schemaversion>1.2</schemaversion>
  </metadata>
  <organizations default="ORG-1">
    <organization identifier="ORG-1">
      <title>${escapeXml(s.title)}</title>
      <item identifier="ITEM-1" identifierref="RES-1">
        <title>${escapeXml(s.title)}</title>
        <adlcp:masteryscore>${s.passScore}</adlcp:masteryscore>
      </item>
    </organization>
  </organizations>
  <resources>
    <resource identifier="RES-1" type="webcontent" adlcp:scormtype="sco" href="index.html">
      <file href="index.html"/>
      <file href="scorm.js"/>
      <file href="style.css"/>
      <file href="${escapeXml(videoFilename)}"/>
    </resource>
  </resources>
</manifest>`;
}

    videoMime: videoMime,
    questions: s.questions.map(q => ({
      text: q.text,
      type: q.type,
      choices: q.choices.filter(c => c.trim()),
      correctIndex: q.correctIndex
    }))
  };

  return `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>${escapeHtml(s.title)}</title>

<script src="scorm.js"><\/script>
</head>
<body>
<div id="app">
  <header class="course-head">
    <img src="https://pub-88f136a47a5846d5b7e47fbce605719b.r2.dev/SplashScriptWhite_RedCar.png" alt="Splash Car Washes">
    <div class="head-text">
      <div class="eyebrow">Splash Training</div>
      <h1 id="courseTitle"></h1>
    </div>

        Your browser does not support the video tag.
      </video>
      <div class="video-foot">
        <p class="muted" id="videoHint">Watch the video, then continue to the quiz.</p>
        <button class="btn primary" id="toQuizBtn" disabled>Continue to quiz</button>

// ---------- SCORM wrapper (goes into scorm.js inside the package) ----------
const SCORM_WRAPPER_JS = String.raw`
// SCORM 1.2 API wrapper. Walks window.parent chain to find window.API.
// All functions are fail-safe: if the LMS isn't there (e.g. previewing
// the index.html locally), they no-op and the course still runs.
(function() {
  var API = null;
  var initialized = false;
  var MAX_DEPTH = 500;

  function findAPI(win) {
    var depth = 0;
    while (win && win.API == null && win.parent && win.parent !== win && depth < MAX_DEPTH) {
      depth++;
      win = win.parent;
    }
    return win && win.API ? win.API : null;
  }

  function getAPI() {
    if (API) return API;
    API = findAPI(window);
    if (!API && window.opener) API = findAPI(window.opener);
    return API;
  }

  function call(name, val) {
    var api = getAPI();
    if (!api) return null;
    try {
      if (val === undefined) return api[name]("");
      return api[name]("", val);
    } catch (e) { return null; }
  }

  window.SCORM = {
    init: function() {
      if (initialized) return true;
      var api = getAPI();
      if (!api) { initialized = false; return false; }
      var r = call("LMSInitialize");
      initialized = (r === "true" || r === true);
      if (initialized) {
        // Set incomplete on launch so the LMS sees a heartbeat.
        call("LMSSetValue", "cmi.core.lesson_status");
        var status = call("LMSGetValue", "cmi.core.lesson_status");
        if (!status || status === "not attempted" || status === "") {
          api["LMSSetValue"]("cmi.core.lesson_status", "incomplete");
        }
        api["LMSCommit"]("");
      }
      return initialized;
    },
    setScore: function(raw, max, min) {
      var api = getAPI();
      if (!api || !initialized) return false;
      try {
        api["LMSSetValue"]("cmi.core.score.raw", String(raw));
        api["LMSSetValue"]("cmi.core.score.max", String(max == null ? 100 : max));
        api["LMSSetValue"]("cmi.core.score.min", String(min == null ? 0 : min));
        api["LMSCommit"]("");
        return true;
      } catch (e) { return false; }
    },
    setStatus: function(status) {
      var api = getAPI();
      if (!api || !initialized) return false;
      try {
        api["LMSSetValue"]("cmi.core.lesson_status", status);
        api["LMSCommit"]("");
        return true;
      } catch (e) { return false; }
    },
    setExit: function(reason) {
      var api = getAPI();
      if (!api || !initialized) return false;
      try {
        api["LMSSetValue"]("cmi.core.exit", reason || "");
        api["LMSCommit"]("");
        return true;
      } catch (e) { return false; }
    },
    finish: function() {
      if (!initialized) return false;
      var api = getAPI();
      if (!api) return false;
      try {
        api["LMSCommit"]("");
        api["LMSFinish"]("");
        initialized = false;
        return true;
      } catch (e) { return false; }
    },
    isConnected: function() {
      return initialized;
    }
  };

  // Auto-init on load; auto-finish on unload.
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", function() { window.SCORM.init(); });
  } else {
    window.SCORM.init();
  }
  window.addEventListener("beforeunload", function() {
    try { window.SCORM.setExit("suspend"); window.SCORM.finish(); } catch (e) {}
  });
})();
`;

// ---------- Player UI (goes into index.html <script>) ----------
const PLAYER_JS = String.raw`
function initPlayer() {
  var cfg = window.COURSE_CONFIG;
  document.getElementById("courseTitle").textContent = cfg.title;
  document.getElementById("courseDesc").textContent = cfg.description || "";

  var beginBtn = document.getElementById("beginBtn");
  var toQuizBtn = document.getElementById("toQuizBtn");
  var submitBtn = document.getElementById("submitQuiz");
  var retryBtn = document.getElementById("retryBtn");
  var finishBtn = document.getElementById("finishBtn");
  var player = document.getElementById("player");
  var playerSource = document.getElementById("playerSource");
  playerSource.src = cfg.videoFilename;
  playerSource.type = cfg.videoMime;
  player.load();

  function show(id) {
    ["screen-intro","screen-video","screen-quiz","screen-results"].forEach(function(n) {
      document.getElementById(n).hidden = (n !== id);
    });
    window.scrollTo(0, 0);
  }

  beginBtn.addEventListener("click", function() { show("screen-video"); });

  player.addEventListener("ended", function() { toQuizBtn.disabled = false; });
  // Allow advancing even without full play (some LMSs reload mid-video).
  player.addEventListener("timeupdate", function() {
    if (player.duration && player.currentTime / player.duration > 0.9) {
      toQuizBtn.disabled = false;
    }
  });

  toQuizBtn.addEventListener("click", function() {
    renderQuiz(cfg);
    show("screen-quiz");
  });

  submitBtn.addEventListener("click", function() {
    var result = gradeQuiz(cfg);
    showResults(cfg, result);
  });

  retryBtn.addEventListener("click", function() {
    renderQuiz(cfg);
    show("screen-quiz");
  });

  finishBtn.addEventListener("click", function() {
    try { window.SCORM && window.SCORM.setExit(""); window.SCORM && window.SCORM.finish(); } catch (e) {}
    window.close(); // some LMSs honor this; others ignore.
  });
}

function renderQuiz(cfg) {
  var form = document.getElementById("quizForm");
  form.innerHTML = "";
  cfg.questions.forEach(function(q, qi) {
    var qDiv = document.createElement("div");
    qDiv.className = "qblock";
    var heading = document.createElement("p");
    heading.className = "qtext";
    heading.textContent = (qi + 1) + ". " + q.text;
    qDiv.appendChild(heading);
    q.choices.forEach(function(c, ci) {
      var id = "q" + qi + "c" + ci;
      var row = document.createElement("label");
      row.className = "qchoice";
      row.setAttribute("for", id);
      var radio = document.createElement("input");
      radio.type = "radio";
      radio.name = "q" + qi;
      radio.value = String(ci);
      radio.id = id;
      var span = document.createElement("span");
      span.textContent = c;
      row.appendChild(radio);
      row.appendChild(span);
      qDiv.appendChild(row);
    });
    form.appendChild(qDiv);
  });
}

function gradeQuiz(cfg) {
  var correct = 0;
  var total = cfg.questions.length;
  var answers = [];
  cfg.questions.forEach(function(q, qi) {
    var picked = document.querySelector('input[name="q' + qi + '"]:checked');
    var pickedIdx = picked ? Number(picked.value) : -1;
    var isCorrect = pickedIdx === q.correctIndex;
    if (isCorrect) correct++;
    answers.push({ pickedIdx: pickedIdx, correct: isCorrect });
  });
  var pct = total === 0 ? 0 : Math.round((correct / total) * 100);
  return { correct: correct, total: total, pct: pct, answers: answers };
}

function showResults(cfg, result) {
  var passed = result.pct >= cfg.passScore;
  document.getElementById("resultsHeading").textContent = passed ? "Passed" : "Not passed";
  document.getElementById("resultsHeading").className = passed ? "pass" : "fail";
  document.getElementById("resultsScore").textContent = "Score: " + result.pct + "%  (" + result.correct + " of " + result.total + ")";
  document.getElementById("resultsMsg").textContent = passed
    ? "Nice work — your completion has been recorded."
    : "You need " + cfg.passScore + "% to pass. Try again.";
  document.getElementById("retryBtn").hidden = passed;
  document.getElementById("finishBtn").hidden = !passed;

  // Report to LMS
  try {
    if (window.SCORM && window.SCORM.isConnected()) {
      window.SCORM.setScore(result.pct, 100, 0);
      window.SCORM.setStatus(passed ? "passed" : "failed");
      if (passed) window.SCORM.setExit("");
    }
  } catch (e) {}

  document.getElementById("screen-results").hidden = false;
  document.getElementById("screen-quiz").hidden = true;
  window.scrollTo(0, 0);
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", initPlayer);
} else {
  initPlayer();
}
`;
